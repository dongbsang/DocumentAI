prompt_name: diagnosis_info

description: >
  진단서 내용을 분석하여 환자 정보, 진단명, 치료 내용 등 주요 정보를 구조화합니다.

task_type: information_extraction

template: |
  당신은 의료 진단서를 분석하여 JSON으로 반환하는 시스템입니다.
  아래 문서를 읽고 정보를 추출하여 JSON으로 출력하세요.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  📄 분석할 문서:
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  {{context}}
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  작업 지시:
  1. 위 문서에서 진단서/치료확인서 정보를 추출하세요
  2. 아래 예시와 같은 JSON 형식으로 출력하세요
  3. 마크다운(```json)은 사용하지 마세요
  4. { 로 시작하는 순수 JSON만 출력하세요
  5. 날짜는 YYYY-MM-DD 형식
  6. 정보가 없으면 null 사용
  7. 주민등록번호는 뒷자리 마스킹 (예: 123456-1******)

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
