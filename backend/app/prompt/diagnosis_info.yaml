yamlprompt_name: diagnosis_info

description: >
  진단서 내용을 분석하여 환자 정보, 진단명, 치료 내용 등 주요 정보를 구조화합니다.
  항목이 없을 경우에는 "없음"이라고 명시해주세요.

task_type: information_extraction

template: |
  다음은 의료 진단서입니다. 내용을 읽고 아래의 형식에 맞게 필요한 정보를 추출해 주세요.
  항목이 누락되어 있다면 "없음"이라고 기입해주세요.

  ---
  {{context}}
  ---

  아래 형식에 맞춰 정보를 추출해주세요
  - 모든 항목을 반드시 채워주세요. 누락된 항목은 '없음'이라고 써 주세요.
  - (복수일 경우 여러 개 작성)이라고 명시된 항목은 여러 개의 정보를 입력할 수 있습니다.
  - (복수일 경우 여러 개 작성)이라고 명시되어있는 TEXT 그 자체는 결과물에 보여주지 않습니다.
  - 각 항목은 '-'로 시작하며, 항목명과 내용은 ':'로 구분합니다.
  - 날짜는 YYYY년 MM월 DD일 형식으로 작성해주세요.

  [문서 정보]
  - 문서 종류: 진단서
  - 발급 일자:
  - 발급 목적:
  - 의료기관명:
  - 의료기관 주소:
  - 의료기관 전화번호:

  [환자 정보]
  - 환자명:
  - 주민등록번호:
  - 성별:
  - 나이:
  - 환자 등록번호:

  [진료 정보]
  - 진료과:
  - 담당의사명:
  - 진단 일자:
  - 진단명 (상병명):
  (복수일 경우 여러 개 작성)
  - 질병 코드:

  [치료 내용]
  - 주요 증상:
  - 진단 소견:
  - 치료 내용:
  - 치료 기간:
  - 입원 여부:
  - 입원 기간:
  - 수술 여부:
  - 수술명:

  [향후 계획]
  - 현재 상태:
  - 향후 치료 계획:
  - 특이사항:

  -----------------------------------
  예시:

  [문서 정보]
  - 문서 종류: 진단서
  - 발급 일자: 2024년 11월 10일
  - 발급 목적: 보험청구용
  - 의료기관명: 서울대학교병원
  - 의료기관 주소: 서울특별시 종로구 대학로 101
  - 의료기관 전화번호: 02-1234-5678

  [환자 정보]
  - 환자명: 홍길동
  - 주민등록번호: 850101-1******
  - 성별: 남
  - 나이: 39세
  - 환자 등록번호: 2024-123456

  [진료 정보]
  - 진료과: 정형외과
  - 담당의사명: 김의사
  - 진단 일자: 2024년 11월 05일
  - 진단명 (상병명): 우측 슬관절 전방십자인대 파열
  - 질병 코드: S83.5

  [치료 내용]
  - 주요 증상: 우측 무릎 통증 및 불안정성
  - 진단 소견: MRI 상 우측 무릎 전방십자인대 완전 파열 소견
  - 치료 내용: 전방십자인대 재건술 시행
  - 치료 기간: 2024년 11월 06일 ~ 2024년 11월 08일
  - 입원 여부: 입원
  - 입원 기간: 2024년 11월 06일 ~ 2024년 11월 08일 (3일)
  - 수술 여부: 수술
  - 수술명: 관절경하 전방십자인대 재건술

  [향후 계획]
  - 현재 상태: 수술 후 회복 중, 목발 보행 중
  - 향후 치료 계획: 술후 재활치료 6개월 예정, 정기 외래 추적관찰 필요
  - 특이사항: 수술 후 합병증 없이 양호한 경과 보임
