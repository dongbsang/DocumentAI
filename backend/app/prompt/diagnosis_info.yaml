prompt_name: diagnosis_info

description: >
  진단서 내용을 분석하여 환자 정보, 진단명, 치료 내용 등 주요 정보를 구조화합니다.

task_type: information_extraction

# 출력 스키마 정의
output_schema:
  type: "structured_json"
  description: "진단서 정보를 구조화된 JSON으로 반환"
  
  structure:
    summary:
      title: "환자명"
      subtitle: "주 진단명"
      datetime: "진료일"
      description: "진단 요약"
      status:
        label: "상태"
        type: "info|warning|error"
    
    details:
      document:
        type: "진단서|소견서|처방전"
        issue_date: "발급일"
      
      patient:
        name: "환자명"
        birth_date: "생년월일"
        gender: "성별"
        age: "나이"
      
      diagnosis:
        visit_date: "진료일"
        department: "진료과"
        doctor: "담당의사"
        diagnosis_name: "진단명"
        diagnosis_code: "질병코드"
        symptoms: "주요 증상"
      
      hospital:
        name: "의료기관명"
        address: "병원 주소"
        tel: "병원 전화번호"
      
      treatment:
        description: "치료 내용"
        period: "치료 기간"
        hospitalization: "입원 여부"
        surgery: "수술 여부"

template: |
  당신은 의료 진단서를 분석하여 **구조화된 JSON**으로 반환하는 시스템입니다.
  아래 문서 내용을 읽고 JSON 형식으로만 출력하세요.

  ---
  {{context}}
  ---

  [중요 규칙]
  1. 반드시 JSON 스키마 형식으로만 응답
  2. ```json``` 마크다운 사용 금지
  3. 날짜는 YYYY-MM-DD 형식
  4. 정보가 없으면 null
  5. 개인정보는 마스킹 처리 (주민등록번호 뒷자리 *처리)

  [출력 JSON 스키마]
  {
    "summary": {
      "title": "홍길동",
      "subtitle": "우측 슬관절 전방십자인대 파열",
      "datetime": "2024-11-05",
      "description": "수술 치료 완료, 재활 중",
      "status": {
        "label": "치료 중",
        "type": "warning"
      }
    },
    "details": {
      "document": {
        "type": "진단서",
        "issue_date": "2024-11-10",
        "purpose": "보험청구용"
      },
      "patient": {
        "name": "홍길동",
        "birth_date": "1985-01-01",
        "registration_number": "850101-1******",
        "gender": "남",
        "age": 39,
        "patient_id": "2024-123456"
      },
      "diagnosis": {
        "visit_date": "2024-11-05",
        "department": "정형외과",
        "doctor": "김의사",
        "diagnosis_name": "우측 슬관절 전방십자인대 파열",
        "diagnosis_code": "S83.5",
        "severity": "중등도",
        "symptoms": ["우측 무릎 통증", "불안정성"]
      },
      "hospital": {
        "name": "서울대학교병원",
        "address": "서울특별시 종로구 대학로 101",
        "tel": "02-1234-5678"
      },
      "treatment": {
        "description": "관절경하 전방십자인대 재건술 시행",
        "period": "2024-11-06 ~ 2024-11-08",
        "hospitalization": "입원",
        "hospitalization_period": "3일",
        "surgery": true,
        "surgery_name": "관절경하 전방십자인대 재건술",
        "surgery_date": "2024-11-06"
      },
      "prognosis": {
        "current_status": "수술 후 회복 중, 목발 보행 중",
        "future_plan": "술후 재활치료 6개월 예정",
        "notes": "수술 후 합병증 없이 양호한 경과"
      }
    },
    "meta": {
      "medical_opinion": "MRI 상 우측 무릎 전방십자인대 완전 파열 소견"
    }
  }

  [예시]
  입력:
    환자명: 홍길동
    생년월일: 1985년 1월 1일
    성별: 남
    나이: 39세

    진료과: 정형외과
    담당의: 김의사
    진료일: 2024년 11월 5일

    진단명: 우측 슬관절 전방십자인대 파열
    질병코드: S83.5

    치료: 관절경하 전방십자인대 재건술
    입원기간: 2024년 11월 6일 ~ 8일

  출력 예시: (위의 JSON 스키마 형식과 동일)

  이제 위 진단서를 분석하여 JSON만 출력하세요.
