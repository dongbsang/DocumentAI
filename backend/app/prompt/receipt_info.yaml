prompt_name: receipt_info

description: >
  다양한 형태의 한국어 영수증(카드사 영수증, PG사 영수증, 네이버페이 등 결제내역 화면)을 분석해
  결제·승인·가맹점·판매자 정보를 구조화합니다. 누락 항목은 null로 기입합니다.

task_type: information_extraction

template: |
  당신은 영수증 문서를 분석하여 JSON으로 반환하는 시스템입니다.
  아래 문서를 읽고 정보를 추출하여 JSON으로 출력하세요.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  📄 분석할 문서:
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  {{context}}
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  작업 지시:
  1. 위 문서에서 영수증 정보를 추출하세요
  2. 아래 예시와 같은 JSON 형식으로 출력하세요
  3. 마크다운(```json)은 사용하지 마세요
  4. { 로 시작하는 순수 JSON만 출력하세요
  5. 금액은 숫자만 (쉼표 제거)
  6. 날짜는 YYYY-MM-DD HH:MM:SS 형식
  7. 정보가 없으면 null 사용

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  예시 1: 카페 영수증
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
