prompt_name: receipt_info

description: >
  다양한 형태의 한국어 영수증(카드사 영수증, PG사 영수증, 네이버페이 등 결제내역 화면)을 분석해
  결제·승인·가맹점·판매자 정보를 구조화합니다. 누락 항목은 null로 기입합니다.

task_type: information_extraction

# 출력 스키마 정의 (프론트엔드 친화적)
output_schema:
  type: "structured_json"
  description: "영수증 정보를 구조화된 JSON으로 반환"
  
  structure:
    summary:
      title: "가맹점명 또는 상호"
      subtitle: "총 결제 금액 표시 (예: 464,718원)"
      datetime: "결제 일시 (YYYY-MM-DD HH:MM:SS)"
      description: "한 줄 요약 (카드사, 결제방법 등)"
      status:
        label: "승인 상태"
        type: "success|error|warning|info"
    
    details:
      payment:
        datetime: "결제 일시"
        amount_total: "총금액(숫자)"
        amount_supply: "공급가액(숫자 또는 null)"
        amount_vat: "부가세(숫자 또는 null)"
        currency: "KRW"
        payment_method: "결제수단"
        installment: "할부정보"
        card_company: "카드사"
        approval_number: "승인번호"
        approval_status: "승인상태"
      
      merchant:
        name: "가맹점명"
        category: "업종"
        business_id: "사업자등록번호"
        address: "주소"
        tel: "전화번호"
      
      items:
        type: "array"
        description: "품목 목록"

template: |
  당신은 영수증/결제 문서를 분석하여 **구조화된 JSON**으로 반환하는 시스템입니다.
  아래 문서 내용을 읽고, 지침을 지켜 **반드시 JSON만** 출력하세요.

  ---
  {{context}}
  ---

  [중요 규칙]
  1. 반드시 아래 JSON 스키마 형식으로만 응답하세요
  2. ```json``` 마크다운 사용 금지, 순수 JSON만 출력
  3. 모든 금액은 숫자만 (쉼표 제거)
  4. 날짜는 YYYY-MM-DD HH:MM:SS 형식으로 정규화
  5. 정보가 없으면 null 사용
  6. 할부는 payment_method="할부", installment="3개월" 형식
  7. 일시불은 payment_method="일시불", installment="일시불"

  [출력 JSON 스키마]
  {
    "summary": {
      "title": "가맹점명",
      "subtitle": "464,718원",
      "datetime": "2024-10-02 16:53:42",
      "description": "네이버 현대카드 · 신용(개인) · 일시불",
      "status": {
        "label": "승인 정상",
        "type": "success"
      }
    },
    "details": {
      "payment": {
        "datetime": "2024-10-02 16:53:42",
        "amount_total": 464718,
        "amount_supply": null,
        "amount_vat": null,
        "service_fee": 0,
        "currency": "KRW",
        "payment_method": "신용카드",
        "installment": "일시불",
        "card_company": "네이버 현대카드",
        "card_brand": "현대카드",
        "approval_number": "00961136",
        "approval_status": "정상",
        "transaction_type": "신용(개인)"
      },
      "merchant": {
        "name": "네이버파이낸셜 주식회사",
        "category": "온라인쇼핑몰",
        "representative": "박상진",
        "business_id": "5248601528",
        "address": "경기도 성남시 분당구 정자일로 95",
        "tel": "031-158-8381"
      },
      "items": [
        {
          "name": "STAY3",
          "quantity": 1,
          "unit_price": 464718,
          "total_price": 464718
        }
      ]
    },
    "meta": {
      "pg_provider": "네이버페이",
      "transaction_id": null,
      "source": "네이버페이화면"
    }
  }

  [예시 1: 네이버페이 결제]
  입력:
    - 금액 464,718원
    - 거래 일자 24. 10. 2 · 16:53:42
    - 결제 구분 일시불
    - 결제 카드 네이버 현대카드
    - 승인번호 00961136
    - 가맹점 네이버파이낸셜 주식회사

  출력 예시:
  {
    "summary": {
      "title": "네이버파이낸셜 주식회사",
      "subtitle": "464,718원",
      "datetime": "2024-10-02 16:53:42",
      "description": "네이버 현대카드 · 일시불",
      "status": {
        "label": "승인 정상",
        "type": "success"
      }
    },
    "details": {
      "payment": {
        "datetime": "2024-10-02 16:53:42",
        "amount_total": 464718,
        "amount_supply": null,
        "amount_vat": null,
        "service_fee": 0,
        "currency": "KRW",
        "payment_method": "일시불",
        "installment": "일시불",
        "card_company": "네이버 현대카드",
        "card_brand": "현대카드",
        "approval_number": "00961136",
        "approval_status": "정상",
        "transaction_type": "신용(개인)"
      },
      "merchant": {
        "name": "네이버파이낸셜 주식회사",
        "category": "온라인쇼핑몰",
        "representative": "박상진",
        "business_id": "5248601528",
        "address": "경기도 성남시 분당구 정자일로 95",
        "tel": "031-158-8381"
      },
      "items": [
        {
          "name": "STAY3",
          "quantity": 1,
          "unit_price": 464718,
          "total_price": 464718
        }
      ]
    },
    "meta": {
      "pg_provider": "네이버페이",
      "transaction_id": null,
      "source": "네이버페이화면"
    }
  }

  이제 위 문서를 분석하여 JSON만 출력하세요.
